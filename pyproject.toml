[project]
name = "youtube-study-agent"
version = "0.1.0"
description = "Autonomous browser agent that summarizes a YouTube study playlist into Markdown notes, using Camoufox, LangGraph, and a local LLM (Ollama)."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "camoufox[geoip]>=0.4.11",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "ollama>=0.3.3",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]
finetune = [
    "unsloth",
    "torch",
    "transformers>=4.44.0",
    "datasets",
    "trl",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["browser", "graph", "llm", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"
